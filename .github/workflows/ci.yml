name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fincore
          POSTGRES_PASSWORD: fincore_ci
          POSTGRES_DB: fincore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fincore -d fincore_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      FINCORE_TEST_DATABASE_URL: postgres://fincore:fincore_ci@localhost:5432/fincore_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test (unit + database)
        run: go test -race -count=1 ./...

      - name: Migrate CLI round trip
        env:
          DATABASE_URL: ${{ env.FINCORE_TEST_DATABASE_URL }}
        run: |
          go run ./cmd/migrate reset
          go run ./cmd/migrate up
          go run ./cmd/migrate status

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

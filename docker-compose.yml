services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fincore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincore_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fincore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincore} -d ${POSTGRES_DB:-fincore}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

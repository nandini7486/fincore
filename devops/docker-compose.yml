# FinCore local stack.
#
#   docker compose -f devops/docker-compose.yml up -d --build        # everything
#   docker compose -f devops/docker-compose.yml up -d postgres       # database only
#   docker compose -f devops/docker-compose.yml run --rm fincorectl reconcile
#
# Start order: postgres (healthy) -> migrate (runs once, must succeed) ->
# api + worker. All published ports bind to 127.0.0.1 only.

x-fincore-image: &fincore-image
  image: fincore:${FINCORE_VERSION:-dev}
  build:
    context: ../backend
    dockerfile: ../devops/docker/Dockerfile
    args:
      VERSION: ${FINCORE_VERSION:-dev}

x-app-db: &app-db
  # The API, worker and fincorectl connect as the least-privilege login role.
  DATABASE_URL: postgres://${APP_DB_USER:-fincore_api}:${APP_DB_PASSWORD:-fincore_api_local_dev}@postgres:5432/${POSTGRES_DB:-fincore}?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fincore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincore_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fincore}
      APP_DB_USER: ${APP_DB_USER:-fincore_api}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-fincore_api_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincore} -d ${POSTGRES_DB:-fincore}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations are a release step: run once, as the schema owner, before the
  # API and worker start. If they fail, nothing else starts.
  migrate:
    <<: *fincore-image
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fincore}:${POSTGRES_PASSWORD:-fincore_local_dev}@postgres:5432/${POSTGRES_DB:-fincore}?sslmode=disable
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *fincore-image
    entrypoint: ["/app/api"]
    environment:
      <<: *app-db
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      DB_MAX_CONNS: ${API_DB_MAX_CONNS:-10}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${API_METRICS_PORT:-9090}:9090"
    # Longer than the API's 10s shutdown timeout, so in-flight payments
    # finish before Docker sends SIGKILL.
    stop_grace_period: 15s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *fincore-image
    entrypoint: ["/app/worker"]
    environment:
      <<: *app-db
      METRICS_ADDR: ":9091"
    ports:
      - "127.0.0.1:${WORKER_METRICS_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck", "http://127.0.0.1:9091/metrics"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    stop_grace_period: 15s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Admin CLI, run on demand:
  #   docker compose -f devops/docker-compose.yml run --rm fincorectl user create -name Alice -email alice@example.com
  fincorectl:
    <<: *fincore-image
    profiles: ["tools"]
    entrypoint: ["/app/fincorectl"]
    environment:
      <<: *app-db
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
